{% extends "base.html" %}
{% block title %}Sign in · HelpDesk Autopilot{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>Sign in</h1>
  <p class="muted">Use your company username and password.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username <input name="username" autocomplete="username" required value="{{ username or '' }}" autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
