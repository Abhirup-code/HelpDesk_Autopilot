x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helpdesk}
  LDAP_URL: ldap://ldap:1389
  LDAP_BASE_DN: dc=example,dc=com
  LDAP_BIND_PASSWORD: ${LDAP_SERVICE_PASSWORD}
  PUBLIC_URL: http://127.0.0.1:8000
  GRAFANA_URL: http://127.0.0.1:3000
  PORTAL_SECRET_KEY: ${PORTAL_SECRET_KEY:?Add PORTAL_SECRET_KEY to .env (see .env.example)}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD:?Add GRAFANA_DB_PASSWORD to .env (see .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ldap:
    build: ./ldap
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Add LDAP_ADMIN_PASSWORD to .env (see .env.example)}
      LDAP_SERVICE_PASSWORD: ${LDAP_SERVICE_PASSWORD:?Add LDAP_SERVICE_PASSWORD to .env (see .env.example)}
    volumes:
      - ldapdata:/var/lib/openldap

  api:
    build: .
    restart: unless-stopped
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ldap:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    healthcheck:
      # Healthy only if the worker finished a run in the last 3 minutes.
      test: ["CMD", "python", "-m", "app.worker", "--check"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    depends_on:
      db:
        condition: service_healthy
      ldap:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.13.4
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - api

  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Add GRAFANA_ADMIN_PASSWORD to .env (see .env.example)}
      # Anyone on this machine can view dashboards without signing in; editing needs admin.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/helpdesk-sla.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      db:
        condition: service_healthy
      prometheus:
        condition: service_started

volumes:
  pgdata:
  ldapdata:
  promdata:
  grafanadata:
