x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-helpdesk}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-helpdesk}
  LDAP_URL: ldap://ldap:1389
  LDAP_BASE_DN: dc=example,dc=com
  LDAP_BIND_PASSWORD: ${LDAP_SERVICE_PASSWORD}
  PUBLIC_URL: http://127.0.0.1:8000

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env first}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  ldap:
    build: ./ldap
    environment:
      LDAP_ADMIN_PASSWORD: ${LDAP_ADMIN_PASSWORD:?Add LDAP_ADMIN_PASSWORD to .env (see .env.example)}
      LDAP_SERVICE_PASSWORD: ${LDAP_SERVICE_PASSWORD:?Add LDAP_SERVICE_PASSWORD to .env (see .env.example)}
    volumes:
      - ldapdata:/var/lib/openldap

  api:
    build: .
    environment: *app-env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ldap:
        condition: service_healthy

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
      ldap:
        condition: service_healthy

volumes:
  pgdata:
  ldapdata:
