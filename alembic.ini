# For creating new migrations on a developer machine:
#   DATABASE_URL=... alembic revision --autogenerate -m "describe the change"
# The app applies migrations itself at startup (see app/db.py: init_db).
[alembic]
script_location = app/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s %(name)s %(message)s
